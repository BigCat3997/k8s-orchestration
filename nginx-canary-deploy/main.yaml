apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-stable-config
  labels:
    app: nginx-canary
    version: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>My App - STABLE V1</title>
      <style>body { background-color: #3498db; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; } h1 { font-size: 3em; }</style>
    </head>
    <body>
      <h1>STABLE Deployment - Version 1 (nginx:1.24.0)</h1>
      <p>This is the stable, blue version (90% traffic).</p>
    </body>
    </html>

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-canary-config
  labels:
    app: nginx-canary
    version: v2
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>My App - CANARY V2</title>
      <style>body { background-color: #2ecc71; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; } h1 { font-size: 3em; }</style>
    </head>
    <body>
      <h1>CANARY Deployment - Version 2 (nginx:1.25.0)</h1>
      <p>This is the new, green version (10% traffic).</p>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-stable-deployment
  labels:
    app: nginx-canary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-canary
      version: v1
  template:
    metadata:
      labels:
        app: nginx-canary
        version: v1
    spec:
      containers:
        - name: nginx
          image: nginx:1.24.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html-volume
          configMap:
            name: nginx-stable-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-canary-deployment
  labels:
    app: nginx-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-canary
      version: v2
  template:
    metadata:
      labels:
        app: nginx-canary
        version: v2
    spec:
      containers:
        - name: nginx
          image: nginx:1.25.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html-volume
          configMap:
            name: nginx-canary-config

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-canary-service
  labels:
    app: nginx-canary
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: nginx-canary
  type: ClusterIP
